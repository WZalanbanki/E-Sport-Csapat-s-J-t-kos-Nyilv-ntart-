<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/meccs.css">
    <link rel="stylesheet" href="css/meccsMobil.css">
    <title>Statify – Meccsek</title>
</head>

<body class="pt-0 meccsOldal">
    <header>
        <nav class="navbar navbar-expand-lg statNav" data-bs-theme="dark">
            <div class="container-fluid">
                <button type="button" class="profilGomb d-lg-none" data-bs-toggle="modal" data-bs-target="#exampleModal" aria-label="Bejelentkezés">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3 21c0-4.5 4-7 9-7s9 2.5 9 7z"/></svg>
                </button>
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="img/Statify logo.png" alt="Statify's logo">
                    <span class="fs-2 fw-bold logoFont">Statify</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Menü">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav mx-lg-auto gap-lg-5 pt-2 pt-lg-0">
                        <li class="nav-item"><a class="nav-link" href="#">Nyilvántartó</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html">Főoldal</a></li>
                        <li class="nav-item"><a class="nav-link active" href="meccs.html">Meccsek</a></li>
                    </ul>
                    <div class="d-flex align-items-center py-2 py-lg-0">
                        <div class="profil"><p class="login m-0">Login</p></div>
                        <div class="ps-2"><button type="button" class="register" data-bs-toggle="modal"
                                data-bs-target="#exampleModal">Register</button></div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-fluid px-3 px-lg-5 meccsFo">
        <h1 class="meccsCim fs-2 mx-auto text-center">Közelgő és lejátszott meccsek</h1>
        <div class="kartyaSav meccsLista"></div>
    </main>

    <div class="modal fade reszletek" tabindex="-1" aria-labelledby=".reszletCim" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content reszlet">
                <button type="button" class="btn-close bezar" data-bs-dismiss="modal" aria-label="Bezárás"></button>
                <div class="modal-body reszletRacs">
                    <div class="kepKeret"><img class="mKep" alt=""></div>
                    <div class="listak">
                        <div><h3 class="csapatNev mNevA"></h3><ul  class="jatekosok mListaA"></ul></div>
                        <div><h3  class="csapatNev mNevB"></h3><ul  class="jatekosok mListaB"></ul></div>
                    </div>
                    <div class="pontok">
                        <span  class="doboz mPontA" aria-label="A csapat pontja">0</span>
                        <span class="kotojel">-</span>
                        <span  class="doboz mPontB" aria-label="B csapat pontja">0</span>
                    </div>
                    <div class="infoSav">
                        <div>
                            <div  class="meccsNev reszletCim"></div>
                            <div  class="allapot mIdopont"></div>
                        </div>
                        <div class="pontGomb">
                            <button  class="gomb mPlusA" type="button">+1 A</button>
                            <span>Pont</span>
                            <button  class="gomb mPlusB"  type="button">+1 B</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Bejelentkezés</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-dark">
                    <form>
                        <div class="pb-3"><label class="col-form-label">Keresztnév:</label><input type="text" class="form-control"></div>
                        <div class="pb-3"><label class="col-form-label">Vezetéknév:</label><input type="text" class="form-control"></div>
                        <div class="pb-3"><label class="col-form-label">User name:</label><input type="text" class="form-control"></div>
                        <div class="mb-3"><label class="col-form-label">Email cím:</label><input type="email" class="form-control"></div>
                        <div class="mb-3"><label class="col-form-label">Jelszó:</label><input type="password" class="form-control"></div>
                        <div class="mb-3"><label class="col-form-label">Jelszó megerősítés:</label><input type="password" class="form-control"></div>
                        <div class="d-flex flex-column align-items-center">
                            <div><input type="checkbox" class="form-check-input" id="adat"> <label class="form-check-label" for="adat">Elfogadom az adattájékoztatót</label></div>
                            <div class="py-2"><input type="checkbox" class="form-check-input" id="hirlevel"> <label class="form-check-label" for="hirlevel">Feliratkozás a hírlevélre</label></div>
                            <button type="button" class="btn btn-success mt-2">Success</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/meccs.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
